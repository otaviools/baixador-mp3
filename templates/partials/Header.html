<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="/" aria-label="djwaltin, início">
      <span class="logo-disc" aria-hidden="true"></span>
      djwaltin<sup>®</sup>
    </a>
    <div class="topbar-right mono">
      <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="status {{ '' if ffmpeg_ok else 'is-off' }}" role="status">
        <span class="status-dot" aria-hidden="true"></span>{{ 'FFmpeg ok' if ffmpeg_ok else 'FFmpeg ausente' }}
      </span>
      <time class="clock" id="clock" aria-label="Horário local"></time>
      {#- Chave de tema: o botão deslizante é um mini disco que rola de um lado para o outro; o sol vira lua. -#}
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Tema escuro" aria-pressed="false" title="Alternar tema">
        <span class="theme-toggle-knob" aria-hidden="true">
          <svg class="theme-icon" viewBox="0 0 24 24">
            <mask id="themeMoonMask">
              <rect width="24" height="24" fill="#fff" />
              <circle class="theme-icon-bite" cx="17" cy="8" r="7" fill="#000" />
            </mask>
            <circle class="theme-icon-core" cx="12" cy="12" r="5" mask="url(#themeMoonMask)" />
            <path class="theme-icon-rays" d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>
