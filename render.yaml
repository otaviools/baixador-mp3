# Blueprint do Render: um Web Service a partir do Dockerfile deste repositório.
# No painel do Render: New → Blueprint → escolha o repositório otaviools/baixador-mp3.
services:
  - type: web
    name: djwaltin
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
